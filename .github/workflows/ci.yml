name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      # Packs, installs into a disposable prefix, and runs the offline smoke
      # (version / help / doctor). No runtime or account required.
      - run: npm test
