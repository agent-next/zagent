name: test-matrix

on:
  push:
    branches: [master]
  pull_request:

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        # All three run here: this repo is public, so Actions minutes are free
        # and unlimited. The private source repo runs ubuntu only, because there
        # Windows bills 2x and macOS 10x.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # Verify the generated package that consumers install on each OS.
      - name: installed package smoke (cross-platform)
        run: npm test
        shell: bash
